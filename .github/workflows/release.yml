name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
            ext: .exe
          - os: macos-latest
            name: macos-aarch64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-06-13

      - uses: Swatinem/rust-cache@v2

      - name: Build Airshipper
        run: cargo build --release -p airshipper --features runehaven

      - name: Package Airshipper
        shell: bash
        run: |
          set -eux
          stage="airshipper-${{ matrix.name }}"
          mkdir -p "$stage"
          cp target/release/airshipper${{ matrix.ext }} "$stage/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            (cd "$stage" && 7z a "../$stage.zip" *)
          else
            (cd "$stage" && zip -r "../$stage.zip" *)
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: airshipper-${{ matrix.name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
