name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
            ext: .exe
          - os: macos-latest
            name: macos-aarch64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-06-13

      - uses: Swatinem/rust-cache@v2

      - name: Build Airshipper
        run: cargo build --release -p airshipper --features runehaven

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nsis --yes --no-progress
          Copy-Item target/release/airshipper.exe "Rune Haven.exe"
          Push-Location client/nsis
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" runehaven.nsi
          $result = $LASTEXITCODE
          Pop-Location
          if ($result -ne 0) { exit $result }
          Move-Item "client/nsis/Rune Haven Setup.exe" "Rune Haven Setup.exe"
          Remove-Item "Rune Haven.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Rune Haven
        shell: bash
        run: |
          set -eux
          stage="rune-haven-${{ matrix.name }}"
          package="rune-haven-${{ matrix.name }}.zip"
          mkdir -p "$stage"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/airshipper.exe "$stage/Rune Haven.exe"
            (cd "$stage" && 7z a "../$package" *)
          else
            app="$stage/Rune Haven.app"
            mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
            cp target/release/airshipper "$app/Contents/MacOS/Rune Haven"
            chmod +x "$app/Contents/MacOS/Rune Haven"

            iconset="$RUNNER_TEMP/RuneHaven.iconset"
            mkdir -p "$iconset"
            icon="client/assets/icons/runehaven-icon.png"
            sips -z 16 16 "$icon" --out "$iconset/icon_16x16.png" >/dev/null
            sips -z 32 32 "$icon" --out "$iconset/icon_16x16@2x.png" >/dev/null
            sips -z 32 32 "$icon" --out "$iconset/icon_32x32.png" >/dev/null
            sips -z 64 64 "$icon" --out "$iconset/icon_32x32@2x.png" >/dev/null
            sips -z 128 128 "$icon" --out "$iconset/icon_128x128.png" >/dev/null
            sips -z 256 256 "$icon" --out "$iconset/icon_128x128@2x.png" >/dev/null
            sips -z 256 256 "$icon" --out "$iconset/icon_256x256.png" >/dev/null
            sips -z 512 512 "$icon" --out "$iconset/icon_256x256@2x.png" >/dev/null
            sips -z 512 512 "$icon" --out "$iconset/icon_512x512.png" >/dev/null
            sips -z 1024 1024 "$icon" --out "$iconset/icon_512x512@2x.png" >/dev/null
            iconutil -c icns "$iconset" -o "$app/Contents/Resources/RuneHaven.icns"

            version="${GITHUB_REF_NAME#v}"
            sed "s/@VERSION@/$version/g" client/macos/Info.plist.in > "$app/Contents/Info.plist"

            codesign --force --deep --sign - "$app"
            ln -s /Applications "$stage/Applications"
            (cd "$stage" && zip -r "../$package" "Rune Haven.app")
            hdiutil create -volname "Rune Haven" -srcfolder "$stage" -ov -format UDZO "Rune Haven-${{ matrix.name }}.dmg"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: rune-haven-${{ matrix.name }}.zip

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: installer-windows-x86_64
          path: Rune Haven Setup.exe

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: installer-macos-aarch64
          path: Rune Haven-macos-aarch64.dmg

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.dmg
          generate_release_notes: true
